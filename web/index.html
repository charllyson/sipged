<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="flutter-web-renderer" content="html" />

  <title>SIPGED</title>
  <meta name="description" content="Sistema Integrado de Planejamento e Gestão de Dados" />

  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:title" content="SIPGED" />
  <meta property="og:description" content="Sistema Integrado de Planejamento e Gestão de Dados" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sisgeo.charllyson.com/" />
  <meta property="og:image" content="https://sisgeo.charllyson.com/assets/logos/sipged/sipged.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SIPGED" />
  <meta name="twitter:description" content="Sistema Integrado de Planejamento e Gestão de Dados" />
  <meta name="twitter:image" content="https://sisgeo.charllyson.com/assets/logos/sipged/sipged.png" />

  <!-- PWA / Ícones -->
  <link rel="icon" type="image/png" href="assets/logos/sipged/sipged.png" />
  <link rel="apple-touch-icon" href="assets/logos/sipged/sipged.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Cor do navegador / PWA -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="msapplication-TileColor" content="#ffffff" />
  <meta name="msapplication-TileImage" content="assets/logos/sipged/sipged.png" />

  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Icons" />

  <!-- Conversão HEIC antes do Flutter -->
  <script src="https://unpkg.com/heic2any/dist/heic2any.min.js"></script>
</head>

<body>
<!-- PDF.js -->
<script
        src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs"
        type="module">
</script>

<script type="module">
  var { pdfjsLib } = globalThis;

  if (pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

    window.pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    };
  }
</script>

<!--
  O arquivo flutter_bootstrap.js é gerado pelo Flutter no build web.
  O Android Studio pode marcar como "Cannot resolve file" antes do build.
-->
<!--suppress HtmlUnknownTarget -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
